<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Rounded square background -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#151515"/>
  <!-- O ring -->
  <circle cx="100" cy="100" r="52" fill="none" stroke="#fa7d00" stroke-width="13"/>
  <!-- Dark cutout over slash area -->
  <line x1="62" y1="138" x2="138" y2="62" stroke="#151515" stroke-width="22" stroke-linecap="round"/>
  <!-- Orange slash -->
  <line x1="64" y1="136" x2="136" y2="64" stroke="#fa7d00" stroke-width="10" stroke-linecap="round"/>
  <!-- Accent tick -->
  <line x1="140" y1="60" x2="152" y2="48" stroke="#fa7d00" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
</svg>
